services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${NEXTRAL_POSTGRES_DB:-nextral}
      POSTGRES_USER: ${NEXTRAL_POSTGRES_USER:-nextral}
      POSTGRES_PASSWORD: ${NEXTRAL_POSTGRES_PASSWORD:-nextral}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXTRAL_POSTGRES_USER:-nextral} -d ${NEXTRAL_POSTGRES_DB:-nextral}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  qdrant:
    image: ghcr.io/qdrant/qdrant/qdrant@sha256:86cdc262da7105228d8d42a9733ee95981b3abc3af891b49a0f89bdcb8bf3e0d
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"

  neo4j:
    image: public.ecr.aws/docker/library/neo4j@sha256:f1e52d4dc6da122468c4a3c1050a4f5e117f6d3268625237c34d49166f0d6082
    environment:
      NEO4J_AUTH: ${NEXTRAL_NEO4J_AUTH:-neo4j/nextraldev}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEXTRAL_NEO4J_PASSWORD:-nextraldev} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  minio:
    # Build pinned official upstream source instead of the unavailable Quay server image.
    build:
      context: .
      dockerfile_inline: |
        FROM docker.io/library/golang:1.24.8-alpine3.22@sha256:3d78beb141d98f42337f1252ecf2a5f20374109929a4c3f6817f9e4179cc0ae5 AS build
        ENV CGO_ENABLED=0 GOTOOLCHAIN=local
        WORKDIR /src
        RUN wget -O /tmp/minio.tar.gz https://codeload.github.com/minio/minio/tar.gz/9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a \
            && echo "45521908307306e925c98d629e1c17d78c8b72b6ee242b1bfb1409f7d8ee5841  /tmp/minio.tar.gz" | sha256sum -c - \
            && tar -xzf /tmp/minio.tar.gz --strip-components=1 \
            && go build -mod=readonly -tags kqueue -trimpath -buildvcs=false \
              -ldflags="-s -w -X github.com/minio/minio/cmd.Version=2025-10-15T17:29:55Z -X github.com/minio/minio/cmd.ReleaseTag=RELEASE.2025-10-15T17-29-55Z -X github.com/minio/minio/cmd.CommitID=9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a -X github.com/minio/minio/cmd.ShortCommitID=9e49d5e7a648 -X github.com/minio/minio/cmd.CopyrightYear=2025" \
              -o /out/minio .
        FROM docker.io/library/alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
        LABEL org.opencontainers.image.source="https://github.com/minio/minio" \
              org.opencontainers.image.revision="9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a" \
              org.opencontainers.image.version="RELEASE.2025-10-15T17-29-55Z" \
              org.opencontainers.image.licenses="AGPL-3.0-or-later"
        COPY --from=build /out/minio /usr/bin/minio
        COPY --from=build /etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/ca-certificates.crt
        COPY --from=build /src/LICENSE /usr/share/minio/LICENSE
        COPY --from=build /tmp/minio.tar.gz /usr/share/minio/source.tar.gz
        ENTRYPOINT ["/usr/bin/minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NEXTRAL_MINIO_USER:-nextral}
      MINIO_ROOT_PASSWORD: ${NEXTRAL_MINIO_PASSWORD:-nextraldev}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mc:
    profiles: [tooling]
    build:
      context: .
      dockerfile_inline: |
        FROM docker.io/library/golang:1.24.8-alpine3.22@sha256:3d78beb141d98f42337f1252ecf2a5f20374109929a4c3f6817f9e4179cc0ae5 AS build
        ENV CGO_ENABLED=0 GOTOOLCHAIN=local
        WORKDIR /src
        RUN wget -O /tmp/mc.tar.gz https://codeload.github.com/minio/mc/tar.gz/7394ce0dd2a80935aded936b09fa12cbb3cb8096 \
            && echo "95cd293c7119f16921a6dc515a1fb74a2227f19fd994b9c8b770a154e802ac44  /tmp/mc.tar.gz" | sha256sum -c - \
            && tar -xzf /tmp/mc.tar.gz --strip-components=1 \
            && go build -mod=readonly -trimpath -buildvcs=false \
              -ldflags="-s -w -X github.com/minio/mc/cmd.Version=2025-08-13T08:35:41Z -X github.com/minio/mc/cmd.ReleaseTag=RELEASE.2025-08-13T08-35-41Z -X github.com/minio/mc/cmd.CommitID=7394ce0dd2a80935aded936b09fa12cbb3cb8096 -X github.com/minio/mc/cmd.ShortCommitID=7394ce0dd2a8 -X github.com/minio/mc/cmd.CopyrightYear=2025" \
              -o /out/mc .
        FROM docker.io/library/alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
        LABEL org.opencontainers.image.source="https://github.com/minio/mc" \
              org.opencontainers.image.revision="7394ce0dd2a80935aded936b09fa12cbb3cb8096" \
              org.opencontainers.image.version="RELEASE.2025-08-13T08-35-41Z" \
              org.opencontainers.image.licenses="AGPL-3.0-or-later"
        COPY --from=build /out/mc /usr/bin/mc
        COPY --from=build /etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/ca-certificates.crt
        COPY --from=build /src/LICENSE /usr/share/mc/LICENSE
        COPY --from=build /tmp/mc.tar.gz /usr/share/mc/source.tar.gz
        ENTRYPOINT ["/usr/bin/mc"]
