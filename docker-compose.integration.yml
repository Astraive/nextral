services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${NEXTRAL_POSTGRES_DB:-nextral}
      POSTGRES_USER: ${NEXTRAL_POSTGRES_USER:-nextral}
      POSTGRES_PASSWORD: ${NEXTRAL_POSTGRES_PASSWORD:-nextral}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXTRAL_POSTGRES_USER:-nextral} -d ${NEXTRAL_POSTGRES_DB:-nextral}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  qdrant:
    image: ghcr.io/qdrant/qdrant/qdrant@sha256:86cdc262da7105228d8d42a9733ee95981b3abc3af891b49a0f89bdcb8bf3e0d
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"

  neo4j:
    image: public.ecr.aws/docker/library/neo4j@sha256:f1e52d4dc6da122468c4a3c1050a4f5e117f6d3268625237c34d49166f0d6082
    environment:
      NEO4J_AUTH: ${NEXTRAL_NEO4J_AUTH:-neo4j/nextraldev}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEXTRAL_NEO4J_PASSWORD:-nextraldev} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NEXTRAL_MINIO_USER:-nextral}
      MINIO_ROOT_PASSWORD: ${NEXTRAL_MINIO_PASSWORD:-nextraldev}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
