services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${NEXTRAL_POSTGRES_DB:-nextral}
      POSTGRES_USER: ${NEXTRAL_POSTGRES_USER:-nextral}
      POSTGRES_PASSWORD: ${NEXTRAL_POSTGRES_PASSWORD:-nextral}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXTRAL_POSTGRES_USER:-nextral} -d ${NEXTRAL_POSTGRES_DB:-nextral}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.11.5
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEXTRAL_NEO4J_AUTH:-neo4j/nextraldev}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEXTRAL_NEO4J_PASSWORD:-nextraldev} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NEXTRAL_MINIO_USER:-nextral}
      MINIO_ROOT_PASSWORD: ${NEXTRAL_MINIO_PASSWORD:-nextraldev}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
