[package]
name = "nextral"
version = "0.1.0"
edition = "2021"
description = "Canonical Rust core for runtime-neutral memory and retrieval."
license = "MIT"

[lib]
name = "nextral"
path = "src/lib.rs"

[workspace]
members = [
  "bindings/python",
  "bindings/node",
  "apps/api",
  "apps/cli",
  "apps/mcp",
]
resolver = "2"

[features]
default = ["postgres", "redis", "qdrant", "neo4j", "s3"]
postgres = ["dep:postgres"]
redis = ["dep:redis"]
qdrant = ["dep:reqwest"]
neo4j = ["dep:reqwest"]
s3 = ["dep:reqwest"]
full = ["postgres", "redis", "qdrant", "neo4j", "s3"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["rt", "macros", "sync", "time"] }
tracing = "0.1"
postgres = { version = "0.19", features = ["with-serde_json-1"], optional = true }
redis = { version = "0.27", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
async-trait = "0.1"
sha2 = "0.10"
