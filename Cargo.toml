[package]
name = "nextral"
version = "0.1.0"
edition = "2021"
description = "Canonical Rust core for runtime-neutral memory and retrieval."
license = "MIT"
repository = "https://github.com/Astraive/nextral"
readme = "README.md"
include = ["Cargo.toml", "Cargo.lock", "build.rs", "src/**", "contracts/**", "migrations/**", "fixtures/evaluation/representative.json", "examples/research_host.rs", "examples/research_evaluation.rs", "README.md", "LICENSE"]

[lib]
name = "nextral"
path = "src/lib.rs"

[workspace]
members = [
  "bindings/python",
  "bindings/node",
  "apps/api",
  "apps/cli",
  "apps/mcp",
]
resolver = "2"

[features]
default = ["postgres", "redis", "qdrant", "neo4j", "s3"]
postgres = ["dep:postgres", "dep:postgres-native-tls", "dep:native-tls"]
redis = ["dep:redis"]
qdrant = []
neo4j = []
s3 = []
full = ["postgres", "redis", "qdrant", "neo4j", "s3"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tracing = "0.1"
postgres = { version = "0.19", features = ["with-serde_json-1"], optional = true }
redis = { version = "0.27", features = ["tls-rustls", "tls-rustls-webpki-roots"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# 0.1.92 removes redundant must_use attributes from generated futures.
async-trait = "0.1.92"
sha2 = "0.10"
axum = "0.8"
tower = { version = "0.5", features = ["limit", "timeout", "load-shed"] }
tower-http = { version = "0.6", features = ["timeout", "limit"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-health = "0.14"
prost = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
async-graphql = { version = "7", default-features = false, features = ["dynamic-schema"] }
async-graphql-parser = "7"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
subtle = "2.6"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
hmac = "0.12"
postgres-native-tls = { version = "0.5", optional = true }
native-tls = { version = "0.2", optional = true }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
