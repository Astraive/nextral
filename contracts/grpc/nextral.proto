syntax = "proto3";

package nextral.v1;

service MemoryService {
  rpc Ingest(IngestMemoryRequest) returns (IngestMemoryResponse);
  rpc Retrieve(RetrieveMemoryRequest) returns (RetrieveMemoryResponse);
  rpc Forget(ForgetMemoryRequest) returns (ForgetMemoryResponse);
  rpc Query(MemoryQueryRequest) returns (MemoryPage);
  rpc RepairIndex(RepairIndexRequest) returns (RepairIndexResponse);
}

service ReminderService {
  rpc Schedule(ScheduleReminderRequest) returns (ScheduleReminderResponse);
  rpc ListDue(ListDueRemindersRequest) returns (ListDueRemindersResponse);
}

message IngestMemoryRequest {
  string tenant_id = 1;
  string user_id = 2;
  optional string session_id = 3;
  string content = 4;
  string content_type = 5;
  string memory_type = 6;
  string privacy_level = 7;
  optional float importance_score = 8;
  optional float confidence_score = 9;
  repeated string entities = 10;
  repeated string tags = 11;
  optional string source_type = 12;
  repeated string source_message_ids = 13;
  repeated float embedding = 14;
  optional string id = 15;
  repeated GraphHint graph_hints = 16;
}

message GraphHint {
  string from_label = 1;
  string from_name = 2;
  string relationship_type = 3;
  string to_label = 4;
  string to_name = 5;
  float confidence = 6;
}

message IngestMemoryResponse {
  string memory_id = 1;
  string status = 2;
  repeated string validation_errors = 3;
  string dedupe_key = 4;
}

message ScoreBreakdown {
  float semantic_similarity = 1;
  float recency = 2;
  float importance = 3;
  float access = 4;
}

message RetrievalTelemetry {
  uint32 vector_candidates = 1;
  uint32 graph_candidates = 2;
  uint32 merged_candidates = 3;
  uint32 selected_candidates = 4;
  uint32 token_estimate = 5;
  float token_utilization = 6;
  uint64 vector_ms = 7;
  uint64 graph_ms = 8;
  uint64 merge_ms = 9;
  float dedupe_ratio = 10;
  repeated string degraded_reasons = 11;
}

message RetrievedMemory {
  string memory_id = 1;
  string content = 2;
  string source_path = 3;
  float retrieval_score = 4;
  ScoreBreakdown score_breakdown = 5;
  uint32 token_estimate = 6;
}

message RetrieveMemoryRequest {
  string tenant_id = 1;
  string user_id = 2;
  optional string session_id = 3;
  string query_text = 4;
  repeated string entities = 5;
  optional string intent_topic = 6;
  uint32 token_budget = 7;
  repeated string privacy_scope = 8;
  uint32 top_k_vector = 9;
  uint32 max_graph_hops = 10;
  repeated float query_vector = 11;
}

message RetrieveMemoryResponse {
  string tenant_id = 1;
  string user_id = 2;
  string trace_id = 3;
  string status = 4;
  string lane = 5;
  string policy_version = 6;
  float quality_score = 7;
  string severity = 8;
  string decision_action = 9;
  optional string rollback_id = 10;
  RetrievalTelemetry telemetry = 11;
  repeated RetrievedMemory items = 12;
  string retrieval_id = 13;
}

message ForgetMemoryRequest {
  string tenant_id = 1;
  string user_id = 2;
  string memory_id = 3;
  string actor_id = 4;
  string reason = 5;
  bool redact = 6;
}

message ForgetMemoryResponse {
  string workflow_id = 1;
}

message ScheduleReminderRequest {
  string tenant_id = 1;
  string user_id = 2;
  string source_memory_id = 3;
  string kind = 4;
  string title = 5;
  string due_at = 6;
  string timezone = 7;
  optional string priority = 8;
}

message ScheduleReminderResponse {
  string reminder_id = 1;
}

message ListDueRemindersRequest {
  string tenant_id = 1;
  string user_id = 2;
  string due_at_or_before = 3;
}

message ListDueRemindersResponse {
  repeated string reminder_ids = 1;
}

message MemorySummary {
  string id = 1;
  string tenant_id = 2;
  string user_id = 3;
  optional string session_id = 4;
  string content_type = 5;
  string memory_type = 6;
  string privacy_level = 7;
  string status = 8;
  float importance_score = 9;
  optional float confidence_score = 10;
  string preview = 11;
  string created_at = 12;
  string updated_at = 13;
}

message MemoryPage {
  repeated MemorySummary items = 1;
  optional string next_cursor = 2;
  optional uint64 total_count = 3;
}

message MemoryFilters {
  repeated string content_types = 1;
  repeated string memory_types = 2;
  repeated string statuses = 3;
  optional string session_id = 4;
  repeated string tags_any = 5;
  repeated string tags_all = 6;
  repeated string entities_any = 7;
  repeated string entities_all = 8;
  optional string created_after = 9;
  optional string created_before = 10;
}

message MemoryQueryRequest {
  string tenant_id = 1;
  string user_id = 2;
  optional MemoryFilters filters = 3;
  optional uint32 limit = 4;
  optional string cursor = 5;
}

message RepairIndexRequest {
  string tenant_id = 1;
  optional uint32 limit = 2;
}

message RepairIndexResponse {
  uint32 repaired = 1;
  uint32 remaining = 2;
  bool complete = 3;
}
