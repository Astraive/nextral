[package]
name = "nextral-python"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT"
description = "Native Python bridge for the Nextral memory runtime"

[lib]
name = "nextral_python"
crate-type = ["cdylib"]

[dependencies]
nextral = { path = "../.." }
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py310"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
tokio = { version = "1.40", features = ["rt", "macros"] }
serde_json = "1.0"
